app.name=${APP_NAME:Zyphora}

# ================================
# Server Configuration
# ================================
server.port=${SERVER_PORT:8080}

# ================================
# Database Configuration
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=EcommerceHikariPool

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.main.allow-bean-definition-overriding=${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:true}

# ================================
# JWT Configuration
# ================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================
# Brevo Email Configuration
# ================================
brevo.api.key=${BREVO_API_KEY}
user.mail=${USER_MAIL}

# ================================
# Logging
# ================================
logging.level.com.ecommerce=${LOGGING_LEVEL_COM_ECOMMERCE:INFO}

# ============================================================
# Google OAuth
# ============================================================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

# ================================
# AI Chatbot (Groq)
# ================================
groq.api.key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
